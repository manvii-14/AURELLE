<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AURELLE — Sculpt Matter With Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--accent:#78e8f1;--glow:#78e8f133;--bg:#06090e;--tx:#f5f5f7;--mu:#9ea2b2;--line:#ffffff1c;--pn:#0f111adb;--sans:"Space Grotesk",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans)}
button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:none;display:block}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#06090ee0 0%,transparent 22%,transparent 70%,#06090ef2 100%)}
body.chaos::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px #ff2d4a55;animation:pl .7s infinite alternate}
@keyframes pl{to{box-shadow:inset 0 0 220px #ff2d4aa0}}
body.clean .panel,body.clean header,body.clean main,body.clean #info,body.clean .elements,body.clean .hint,body.clean .shade{display:none}
header{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 22px) 32px 12px;pointer-events:none}
.brand{display:flex;gap:12px;align-items:center}
.symbol{height:36px;width:36px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:19px;box-shadow:0 0 28px var(--glow);transition:.4s}
.logo{font-size:19px;letter-spacing:.21em;font-weight:600}
.tagline{font:9px var(--mono);letter-spacing:.15em;color:var(--mu);margin-top:5px}
.status{font:10px var(--mono);letter-spacing:.08em;color:#c4c7d4;display:flex;align-items:center}
.live{width:6px;height:6px;border-radius:50%;background:var(--mc,#8cf0bd);box-shadow:0 0 9px var(--mc,#8cf0bd);margin-right:9px;transition:.3s}
main{position:fixed;z-index:2;left:32px;top:24%;pointer-events:none}
.kicker{font:10px var(--mono);letter-spacing:.19em;color:var(--accent);margin-bottom:17px;transition:color .4s}
h1{font-size:clamp(42px,6vw,82px);font-weight:500;letter-spacing:-.065em;line-height:.94;margin:0}
h1 span{color:var(--accent);transition:color .4s}
.description{font-size:12px;line-height:1.9;color:var(--mu);max-width:300px;margin-top:22px}
#info{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 26px);left:50%;transform:translateX(-50%);pointer-events:none}
#en{display:flex;align-items:center;gap:10px;font:11px var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--accent);padding:9px 18px 9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--pn);backdrop-filter:blur(14px);transition:color .4s}
#en::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
#en.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.9)}}
.elements{position:fixed;z-index:4;right:26px;top:50%;transform:translateY(-38%);display:flex;flex-direction:column;gap:10px}
.element{width:50px;height:50px;border-radius:15px;border:1px solid var(--line);background:#12141dcc;backdrop-filter:blur(12px);font-size:21px;color:#b8bdcc;transition:.25s}
.element:hover{transform:translateX(-4px);color:#fff}
.element.active{color:var(--accent);border-color:var(--accent);background:var(--glow);box-shadow:0 0 26px var(--glow)}
.hint{position:fixed;left:32px;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);z-index:2;max-width:270px;pointer-events:none;font:10px/1.8 var(--mono);color:var(--mu)}
.hint b{color:var(--mc);letter-spacing:.14em;transition:color .3s}
.panel{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 34px));padding:12px 14px 11px;background:var(--pn);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(24px);box-shadow:0 20px 90px #000a}
.tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tool{--c:var(--accent);border:1px solid transparent;color:#b4b8c6;border-radius:11px;padding:10px 13px;font-size:11px;transition:.2s;display:flex;gap:7px;align-items:center;cursor:pointer}
.tool i{font-style:normal;font-size:14px;color:var(--c)}
.tool:hover{background:#ffffff0d;color:#fff}
.tool.active{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 17%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--c) 30%,transparent)}
.sep{height:25px;width:1px;background:var(--line);margin:0 6px}.spacer{flex:1}
#chaos.active{animation:ch .5s infinite alternate}
@keyframes ch{to{box-shadow:0 0 38px #ff6a5a88}}
.element{touch-action:none}.ghost{position:fixed;z-index:20;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:15px;border:1px solid var(--accent);background:var(--glow);display:grid;place-items:center;font-size:21px;color:var(--accent);pointer-events:none;backdrop-filter:blur(8px)}
.controls{border-top:1px solid var(--line);padding-top:11px;margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.label{font:9px var(--mono);color:var(--mu);letter-spacing:.12em}
.slider{display:flex;align-items:center;gap:9px;flex:1;min-width:100px}
input[type=range]{width:100%;accent-color:var(--accent)}
.value{font:10px var(--mono);min-width:32px;text-align:right}
select{background:#1b1d27;color:#e4e5ed;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:10px}
#beat{width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:.25;box-shadow:0 0 0 var(--accent);flex:none}
html,body,button,label,select,input{cursor:none}
.tool i{display:flex}.symbol svg{width:19px;height:19px}.element svg{width:22px;height:22px}
.panel{transition:border-radius .7s,width .7s}.elements{transition:top .7s cubic-bezier(.2,.9,.3,1)}
body[data-e=fire] .panel{border-radius:6px;width:min(840px,calc(100% - 34px))}body[data-e=air] .panel{border-radius:32px;width:min(940px,calc(100% - 34px))}body[data-e=earth] .panel{border-radius:2px 20px;width:min(880px,calc(100% - 34px))}
body[data-e=fire] .elements{top:44%}body[data-e=air] .elements{top:56%}body[data-e=earth] .elements{top:48%}
.piece{pointer-events:auto!important;transition:none!important}.piece.back{transition:transform .8s cubic-bezier(.2,.9,.3,1)!important}
body.phys .panel{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;pointer-events:none}
body.phys .controls{border-color:transparent}body.phys .sep,body.phys .hint{opacity:0}
body.phys .piece{background:var(--pn);border-radius:11px;backdrop-filter:blur(10px)}
#cur,#ring{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
#cur::before{content:'';position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);transition:transform .2s}
#ring::before{content:'';position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1px solid var(--accent);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),background .25s}
#ring.hot::before{transform:scale(1.55);background:var(--glow)}#ring.down::before{transform:scale(.7)}
#cur.hot::before{transform:scale(.5)}
@media(pointer:coarse){#cur,#ring{display:none}}
#toast{position:fixed;z-index:10;top:47%;left:50%;transform:translate(-50%,-50%);background:#0f111aee;border:1px solid var(--mc,#fff3);padding:13px 20px;border-radius:10px;font:10px var(--mono);letter-spacing:.14em;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:calc(100vw - 24px)}
#toast.show{opacity:1}
@media(max-width:650px){header{padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 10px}.logo{font-size:16px}.status,.tagline{display:none}main{left:20px;top:15%}h1{font-size:46px}.description{max-width:230px;font-size:11px}.elements{right:10px;gap:7px;top:42%}.element{width:42px;height:42px;font-size:18px}.panel{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:calc(100% - 14px);padding:9px}.tool{padding:9px 8px;font-size:10px;gap:4px}.tool span{display:none}.tool.sn span{display:inline}.hint{left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 230px);font-size:9px;max-width:60vw}.controls{gap:8px}.label{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive matter canvas"></canvas><div class="shade"></div>
<header>
 <div class="brand"><div class="symbol" id="sym" data-ic="chaos"></div><div><div class="logo">AURELLE</div></div></div>
 <div class="status"><span class="live"></span><span id="stat">LIVE MATTER FIELD</span></div>
</header>
<div id="info"><div id="en">Water</div></div>
<nav class="elements" aria-label="Elements">
 <button class="element active" data-el="water" title="Water (1)" aria-label="Water" data-ic="water"></button>
 <button class="element" data-el="fire" title="Fire (2)" aria-label="Fire" data-ic="fire"></button>
 <button class="element" data-el="air" title="Air (3)" aria-label="Air" data-ic="air"></button>
 <button class="element" data-el="earth" title="Earth (4)" aria-label="Earth" data-ic="earth"></button>
</nav>
<div class="hint"><b id="hm">SCULPT</b><br><span id="ht"></span><br><span>Drag an element onto another to fuse them.</span><br><span>Shake the cursor to shatter the UI.</span></div>
<div class="panel">
 <div class="tools" role="group" aria-label="Interaction mode">
  <button class="tool active" data-mode="sculpt" style="--c:var(--accent)"><i data-ic="sculpt"></i><span>Sculpt</span></button>
  <button class="tool" data-mode="stir" style="--c:hsl(285 90% 68%)"><i data-ic="stir"></i><span>Stir</span></button>
  <button class="tool" data-mode="gust" style="--c:hsl(190 90% 68%)"><i data-ic="gust"></i><span>Gust</span></button>
  <button class="tool" data-mode="attract" style="--c:hsl(330 90% 68%)"><i data-ic="attract"></i><span>Attract</span></button>
  <div class="sep"></div>
  <button class="tool sn" id="sound" style="--c:#8cf0bd"><i data-ic="sound"></i><span>Sound on</span></button>
  <button class="tool" id="mic" style="--c:#ffd166" title="React to microphone"><i data-ic="mic"></i><span>Mic</span></button>
  <label class="tool" id="filel" style="--c:#ffd166" title="React to an audio file"><i data-ic="file"></i><span>Audio file</span><input id="file" type="file" accept="audio/*" hidden></label>
  <button class="tool" id="pause" style="--c:#ffd166;display:none" title="Pause or play the audio"><i data-ic="pause"></i><span>Pause</span></button>
  <button class="tool" id="fs" style="--c:#c7baff" title="Hide interface (F)"><i data-ic="fs"></i><span>Immerse</span></button>
  <button class="tool" id="shatter" style="--c:#ff9b58" title="Shatter the UI (shake cursor or G)"><i data-ic="shatter"></i><span>Shatter</span></button>
  <button class="tool" id="lock" style="--c:var(--accent)" title="Lock the palette"><i data-ic="unlock"></i><span>Lock</span></button>
  <div class="spacer"></div>
  <button class="tool" id="chaos" style="--c:#ff6a5a"><i data-ic="chaos"></i><span>Chaos</span></button>
 </div>
 <div class="controls">
  <span class="label">FORCE</span><div class="slider"><input id="force" type="range" min="10" max="100" value="65" aria-label="Force"><span id="fv" class="value">65%</span></div>
  <span class="label">VOLUME</span><div class="slider"><input id="volume" type="range" min="0" max="100" value="45" aria-label="Volume"><span id="vv" class="value">45%</span></div>
  <span id="beat" title="Beat"></span><span class="label">MUSIC SENS</span><div class="slider"><input id="sens" type="range" min="10" max="100" value="60" aria-label="Music sensitivity"><span id="sv" class="value">60%</span></div>
  <select id="quality" aria-label="Simulation density"><option value="1">Balanced field</option><option value="1.5">Dense field</option><option value=".6">Performance</option></select>
  <button class="tool" id="reset"><i data-ic="reset"></i><span>Reset</span></button>
 </div>
</div>
<div id="toast" role="status"></div><div id="cur"></div><div id="ring"></div>
<script>
(()=>{'use strict';
const cv=document.getElementById('scene'),c=cv.getContext('2d'),$=id=>document.getElementById(id),root=document.documentElement;
const CFG={water:{name:'Water',desc:'FLUID / CONTINUOUS / RESPONSIVE',col:[78,221,244],acc:'#78e8f1',root:293.66},fire:{name:'Fire',desc:'TURBULENT / RISING / UNTAMED',col:[255,112,49],acc:'#ff9b58',root:220},air:{name:'Air',desc:'FLOWING / WEIGHTLESS / EXPANSIVE',col:[190,178,255],acc:'#c7baff',root:392},earth:{name:'Earth',desc:'DENSE / ANCIENT / RESONANT',col:[218,177,112],acc:'#e1bd82',root:130.81}};
const ORDER=['water','fire','air','earth'];
const HUE={water:186,fire:24,air:252,earth:20},ACC=h=>`hsl(${h} 88% 70%)`;for(const k in CFG)CFG[k].acc=ACC(HUE[k]);let lock=false;
function setAccent(h){root.style.setProperty('--accent',ACC(h));root.style.setProperty('--glow',`hsl(${h} 88% 70% / .2)`)}
const I={sculpt:'M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z',stir:'M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M9 12a3 3 0 0 1 6 0',gust:'M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8',attract:'M12 12h.01M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18',sound:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11',mute:'M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6',mic:'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4',file:'M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3M19 16a3 3 0 1 1-3-3',fs:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',shatter:'M12 2l1.5 7L20 6l-4 6 6 2-7 1 1 7-4-5-5 4 1-7-6-2 6-2-3-6 6 3z',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',unlock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 7-2.6',pause:'M8 5v14M16 5v14',play:'M7 5l12 7-12 7z',chaos:'M12 2v20M2 12h20M5 5l14 14M19 5L5 19',reset:'M4 12a8 8 0 1 0 3-6.2M4 4v5h5',water:'M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z',fire:'M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 0-7 1-10z',air:'M3 9h10a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M3 19h7',earth:'M2 20l7-12 4 7 3-4 6 9z'};
const svg=d=>`<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const MODES={sculpt:{n:'SCULPT',h:null,tip:'Press to shape the field. Drag to carve. Flick to release energy.'},stir:{n:'STIR',h:285,tip:'Hold or drag to spin up a tornado.'},gust:{n:'GUST',h:190,tip:'Sweep to blow matter along your motion.'},attract:{n:'ATTRACT',h:330,tip:'Hold to pull everything in. Release to blast it out.'}};
const BG={water:['#05202e','#020a12'],fire:['#1a0809','#050203'],air:['#17123a','#070612'],earth:['#2d1a2a','#0a0709'],mud:['#2a1a0e','#0d0805']};
let W,H,DPR,element='water',mode='sculpt',force=.65,volume=.45,snd=true,chaos=false,chaosPower=0,t=0,last=0,quality=1,clr=1,toastT,lastNote=0;
let particles=[],waves=[],sparks=[],ripples=[],rings=[],frags=[];
const core={pulse:0},trail=[];let fusion=null,fuseT=0,flash=0;
const music={bass:0,mid:0,hi:0,beat:0,on:false,avg:0,lastB:0,sens:.6};
const pointer={x:-1000,y:-1000,vx:0,vy:0,down:false,active:false,t:0};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),mix=(a,b,n)=>a+(b-a)*n,dist=(x,y,a,b)=>Math.hypot(x-a,y-b);
const col=(a=1,e=element)=>{const k=CFG[e].col;return `rgba(${k[0]},${k[1]},${k[2]},${a})`};
const mc=(a=1,m=mode)=>{const h=MODES[m].h;return h==null?col(a):`hsla(${h},90%,68%,${a})`};
const mcSolid=(m=mode)=>{const h=MODES[m].h;return h==null?CFG[element].acc:`hsl(${h} 90% 68%)`};
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1500)}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);cv.width=W*DPR;cv.height=H*DPR;c.setTransform(DPR,0,0,DPR,0,0);seed();clr=1}
function seed(){particles=[];sparks=[];waves=[];ripples=[];rings=[];frags=[];core.pulse=0;const n=Math.floor(W*H/650*quality*(W<700?.6:1));
 for(let i=0;i<n;i++){const x=rand(0,W),y=rand(0,H);particles.push({x,y,vx:rand(-.5,.5),vy:rand(-.5,.5),hx:x,hy:y,size:rand(.7,2.1),phase:rand(0,6.28),k:Math.random()})}
 for(let i=0;i<150;i++)sparks.push(newSpark(true));
 for(let i=0;i<16;i++)frags.push({x:rand(0,W),y:rand(0,H),r:rand(60,160)*(W<700?.6:1),rot:rand(0,6.283),vr:rand(-.003,.003),sd:rand(1,1e4),vx:rand(-.3,.3),vy:rand(-.15,.15)})}
function newSpark(init){return{x:rand(0,W),y:init?rand(0,H):H+rand(0,60),vx:rand(-1,1),vy:rand(-2,-.5),life:init?rand(0,1):0,size:rand(.8,2.4)}}
/* ---------- physics ---------- */
function addWave(x,y,vx,vy,p=1){const s=Math.hypot(vx,vy);waves.push({x,y,r:2,speed:2+s*.16,strength:(.8+force*1.6+s*.025)*p,spin:Math.random()<.5?-1:1});if(waves.length>55)waves.shift()}
function disturb(x,y,vx,vy,p=1){const k=p*(chaos?3.6:1);addWave(x,y,vx,vy,k);
 if(element==='water'){ripples.push({x,y,r:3,life:1,speed:2+Math.hypot(vx,vy)*.18});if(k>1.1)for(let i=0;i<8;i++)sparks.push({x,y,vx:rand(-4,4)*k,vy:rand(-6,-1)*k,life:0,size:rand(1,3)})}
 if(element==='fire')for(let i=0;i<Math.min(45,5+k*6|0);i++)sparks.push({x:x+rand(-12,12),y:y+rand(-10,10),vx:rand(-3,3)*k,vy:rand(-5,-1)*k,life:0,size:rand(1,3.4)});
 if(element==='earth'){for(let i=0;i<Math.min(40,6+k*6|0);i++)sparks.push({x,y,vx:rand(-4,4)*k,vy:rand(-7,-1)*k,life:0,size:rand(2,5)});ripples.push({x,y,r:3,life:1,speed:3+k});core.pulse=Math.min(1.5,core.pulse+.4*k)}
 if(element==='air')for(let i=0;i<4;i++)sparks.push({x,y,vx:rand(-2,2)*k+vx*.3,vy:rand(-2,2)*k+vy*.3,life:0,size:rand(1,2)})}
function twist(x,y){if(mode!=='stir'||!pointer.active)return[x,y];const dx=x-pointer.x,dy=y-pointer.y,d=Math.hypot(dx,dy),R=360;if(d>=R)return[x,y];const q=1-d/R,a=q*q*((pointer.down?4:2.6)*(.5+force)+t*5),ca=Math.cos(a),sa=Math.sin(a),k=1-q*q*.25;return[pointer.x+(dx*ca-dy*sa)*k,pointer.y+(dx*sa+dy*ca)*k]}
function field(x,y){const nx=x/W,ny=y/H,k=chaos?1+chaosPower*2.8:1;let vx=0,vy=0;
